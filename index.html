<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ler qr-code de Certificado - IESPRO</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #004080;
    }

    button {
      background-color: #007bff;
      color: white;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #reader {
      width: 300px;
      margin: 0 auto;
      display: none;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      white-space: pre-wrap;
      border-radius: 10px;
    }

    .valido {
      background-color: #d4edda;
      color: #155724;
    }

    .erro {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>

<h1>Ler qr-code de Certificado</h1>
<button onclick="iniciarLeitura()">📷 Ler QR Code</button>

<div id="reader"></div>
<div id="resultado"></div>

<script>
  const base62chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

  function fromBase62(str) {
    let num = 0;
    for (let i = 0; i < str.length; i++) {
      num = num * 62 + base62chars.indexOf(str[i]);
    }
    return num;
  }

  function fromCharCodesBase62(base62Str) {
    let texto = '';
    for (let i = 0; i < base62Str.length; i += 2) {
      const b62 = base62Str.substring(i, i + 2);
      const code = fromBase62(b62);
      texto += String.fromCharCode(code);
    }
    return texto.trim();
  }

  let scanner;

  function iniciarLeitura() {
    const readerDiv = document.getElementById("reader");
    const resultadoDiv = document.getElementById("resultado");
    readerDiv.style.display = "block";
    resultadoDiv.innerText = '';
    resultadoDiv.className = '';

    scanner = new Html5Qrcode("reader");

    Html5Qrcode.getCameras().then(cameras => {
      if (cameras && cameras.length) {
        scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          codigo => {
            scanner.stop();
            readerDiv.style.display = "none";
            processarCodigo(codigo);
          },
          error => {}
        );
      } else {
        mostrarErro("❌ Nenhuma câmera encontrada.");
      }
    }).catch(err => {
      mostrarErro("❌ Erro ao acessar a câmera.");
    });
  }

  function mostrarErro(msg) {
    const resultadoDiv = document.getElementById("resultado");
    resultadoDiv.className = "erro";
    resultadoDiv.innerText = msg;
  }

  function processarCodigo(codigo) {
    const resultadoDiv = document.getElementById("resultado");
    const partes = codigo.split(".");

    if (partes.length < 6) {
      mostrarErro("❌ Código inválido.");
      return;
    }

    try {
      const dia = Math.floor(fromBase62(partes[0]) / 18) - 10;
      const mes = Math.floor(fromBase62(partes[1]) / 35) - 10;
      const ano = Math.floor(fromBase62(partes[2]) / 360) - 99;
      const hh = Math.floor(fromBase62(partes[3]) / 19) - 17;
      const mm = Math.floor(fromBase62(partes[4]) / 11) - 11;
      const ss = Math.floor(fromBase62(partes[5]) / 11) - 13;

      const data = `${String(dia).padStart(2, '0')}/${String(mes).padStart(2, '0')}/${ano}`;
      const hora = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;

      const dadosCodificados = partes.slice(6).join('');
      const metade = Math.floor(dadosCodificados.length / 2);
      const curso = fromCharCodesBase62(dadosCodificados.substring(0, metade));
      const aluno = fromCharCodesBase62(dadosCodificados.substring(metade));

      resultadoDiv.className = "valido";
      resultadoDiv.innerText =
        `✔ Certificado válido:\n\n` +
        `Aluno(a): ${aluno}\nCurso: ${curso}\nData: ${data}\nHora: ${hora}`;
    } catch (e) {
      mostrarErro("❌ Erro ao processar o código.");
    }
  }
</script>

</body>
</html>
